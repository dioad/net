version: "2"

linters:
  default: all
  disable:
    - inamedparam
    - gochecknoinits
    - wsl
    - wsl_v5
    - whitespace
    - wrapcheck
    - exhaustruct
    - exhaustruct_v5
    - err113
    - testpackage
    - depguard
    - paralleltest
    - varnamelen
    - forbidigo
    - funlen
    - gochecknoglobals
    - godox
    - lll
    - mnd
    - noinlineerr
  settings:
    tagliatelle:
      case:
        rules:
          json: snake
  exclusions:
    rules:
      # authz/prefixlist mirrors third-party vendor JSON schemas (AWS
      # ip-ranges.json, Google Cloud's published ranges, Fastly's IP
      # list, etc.) verbatim. Renaming those tags to match our own
      # convention wouldn't just be a style change, it would break
      # parsing of upstream data we don't control.
      - path: 'authz/prefixlist/'
        linters:
          - tagliatelle

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
