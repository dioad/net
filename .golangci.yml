version: "2"

linters:
  default: all
  disable:
    - inamedparam
    - gochecknoinits
    - wsl
    - wsl_v5
    - whitespace
    - wrapcheck
    - exhaustruct
    - exhaustruct_v5
    - err113
    - testpackage
    - depguard
    - paralleltest
    - varnamelen
    - forbidigo
    - funlen
    - gochecknoglobals
    - godox
    - lll
    - mnd
    - noinlineerr

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
